name: CI

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  lint-e-testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tesouraria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tesouraria_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: chave-de-teste-só-para-o-ci-não-usar-em-producao
      BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependências
        run: pip install ".[dev]"

      - name: Instalar browser do Playwright (testes E2E)
        run: playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes
        run: python -m pytest tests/ -v
